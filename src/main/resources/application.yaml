spring:
  application:
    name: order-service

app:
  env: local
  version: 0.0.1-SNAPSHOT

logging:
  level:
    root: INFO
    com.example.logging_demo: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: loggers,env
  endpoint:
    loggers:
      enabled: true